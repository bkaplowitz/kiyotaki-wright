# This is the PyTorch mypy.ini file

[mypy]
plugins = numpy.typing.mypy_plugin

cache_dir = .mypy_cache/normal
allow_redefinition = True
warn_unused_configs = True
warn_redundant_casts = True
show_error_codes = True
show_column_numbers = True
check_untyped_defs = True
disallow_untyped_defs = True
disallow_untyped_decorators = True
local_partial_types = True
enable_error_code = possibly-undefined
warn_unused_ignores = False
pretty = True
python_version = 3.12

# Consolidated ignore_missing_imports sections
[mypy-torch._C._jit_tree_views,torch.for_onnx.onnx,torch.ao.quantization.experimental.*,triton.*,tensorflow.*,tensorboard.*,matplotlib.*,numpy.*,sympy.*,hypothesis.*,tqdm.*,multiprocessing.*,setuptools.*,distutils.*,nvd3.*,future.utils,past.builtins,numba.*,PIL.*,moviepy.*,cv2.*,torchvision.*,pycuda.*,tensorrt.*,tornado.*,pydot.*,networkx.*,scipy.*,IPython.*,google.protobuf.textformat,lmdb.*,mpi4py.*,skimage.*,librosa.*,mypy.*,xml.*,boto3.*,dill.*,usort.*,cutlass_library.*,deeplearning.*,einops.*,libfb.*,torch.*.fb.*,torch.fb.*,torch_xla.*,onnx.*,onnxruntime.*,onnxscript.*,redis,pycocotools.*,dm_control.*,dm_env.*,retro.*,gym.*,torchrl._torchrl.*]
ignore_missing_imports = True

# Consolidated ignore_errors sections
[mypy-test_torch,torch.testing._internal.common_methods_invocations.*,torch.testing._internal.hypothesis_utils.*,torch.testing._internal.common_quantization.*,torch.testing._internal.generated.*,torch.testing._internal.distributed.*,torch.nn.modules.pooling,torch.nn.parallel._functions,torch._appdirs,torch.multiprocessing.pool,torch.overrides,caffe2.python.*,caffe2.proto.*,caffe2.distributed.store_ops_test_util,caffe2.experiments.*,caffe2.contrib.*,caffe2.quantization.server.*,torchvision.*]
ignore_errors = True

# Special cases that need specific settings
[mypy-tools.render_junit,tools.generate_torch_version]
warn_unused_ignores = False

[mypy-torch._inductor.*,mypy-torch._dynamo.*]
disallow_any_generics = True
files =
    torch,
    caffe2,
    test/test_bundled_images.py,
    test/test_bundled_inputs.py,
    test/test_complex.py,
    test/test_datapipe.py,
    test/test_futures.py,
    test/test_numpy_interop.py,
    test/test_torch.py,
    test/test_type_hints.py,
    test/test_type_info.py,
    test/test_utils.py,
    tensordict,
    torchrl
exclude = torch/include/|torch/csrc/|torch/distributed/elastic/agent/server/api.py|torch/testing/_internal|torch/distributed/fsdp/fully_sharded_data_parallel.py
