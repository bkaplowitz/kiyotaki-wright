[project]
name = "kiyotaki_wright"
version = "0.1.0"
description = "Kiyotaki-Wright model with RL"
authors = [
	"Brandon Kaplowitz <bkaplowitzbk@gmail.com>",
]
channels = [
	"conda-forge",
]
platforms = [
	"osx-arm64",
]

[tasks]
start = "python src/benchmarl_ppo.py"
test = "python -m pytest tests/"
lint = "pre-commit run --all-files"

[dependencies]
python = ">=3.12, <3.13"
ruff = ">=0.8.3,<0.9"
pytest = ">=8.3.4,<9"
pytest-check = ">=2.4.1,<3"
pytest-xdist = ">=3.6.1,<4"
pytest-mock = ">=3.14.0,<4"
pytest-profiling = ">=1.7.0,<2"
pytest-timeout = ">=2.3.1,<3"
pytest-sugar = ">=1.0.0,<2"
pytest-cov = ">=6.0.0,<7"
mypy = ">=1.13.0,<2"
matplotlib = ">=3.10.0,<4"


[pypi-dependencies]
torchrl = ">=0.6.0, <0.7"
plotly = ">=5.24.1, <6"
tqdm = ">=4.67.1, <5"
torch = ">=2.5.1, <3"
tensordict = ">=0.6.2, <0.7"
benchmarl = ">=1.3.0, <2"
vmas = ">=1.4.3, <2"
id-marl-eval = "*"
hydra-core = "*"
hydra-submitit-launcher = "*"
wandb = ">=0.16.0, <1"
