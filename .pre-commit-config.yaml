repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: check-docstring-first
    -   id: check-toml
    -   id: trailing-whitespace
    -   id: check-yaml
        exclude: packaging/.*
    -   id: mixed-line-ending
        args:
        - --fix=lf
    -   id: end-of-file-fixer
    -   id: check-added-large-files
        args:
        - --maxkb=500
    -   id: check-merge-conflict
    -   id: check-case-conflict
    -   id: check-ast
-   repo: local
    hooks:
      - id: pytest-check
        name: pytest-fast
        entry: pytest
        language: system
        args: ["-m", "fast", "--quiet"]
        types: [python]
        pass_filenames: false
        always_run: true
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.8.4
  hooks:
    # Run the linter.
    - id: ruff
      types_or: [ python, pyi ]
      args: [ --fix , --unsafe-fixes, --preview]
    # Run the formatter.
    - id: ruff-format
      types_or: [ python, pyi ]
      args: [--preview]
