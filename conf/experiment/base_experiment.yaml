# Default experiment configuration
train_device: "cpu"
collect_device: "cpu"
max_n_iters: 10
on_policy_collected_frames_per_batch: 6000
num_epochs: 30
minibatch_size: 400
lr: 3e-4
max_grad_norm: 1.0
gamma: 0.99
gae_lambda: 0.9
entropy_eps: 1e-4
clip_epsilon: 0.2
evaluation: true
checkpoint_interval: 1000
create_json: true
save_folder: "results"
loggers: ["tensorboard", "csv"]
